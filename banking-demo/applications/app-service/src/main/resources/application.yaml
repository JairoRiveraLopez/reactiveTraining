server:
  port: 8080
spring:
  application:
    name: "jariveraCursoJavaReactivo"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  data:
    mongodb:
      uri: mongodb://localhost:27017/jariveraBankingProject
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 1
        max-concurrency: 5
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Bogota
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
